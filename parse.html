  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #ffffff; --bg-alt: #f7f7f5; --text: #1a1a1a; --text-mid: #4a4a4a;
      --text-light: #717171; --border: #e0ddd8; --accent: #c0392b;
      --pos-noun: rgb(37, 99, 170); --pos-verb: rgb(196, 90, 17);
      --pos-adj: rgb(124, 58, 173); --pos-adv: rgb(31, 122, 90);
      --pos-none: rgb(30, 30, 30);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111; --bg-alt: #1a1917; --text: #e8e4de; --text-mid: #b0aaa0;
        --text-light: #8a847a; --border: #2a2825;
        --pos-noun: rgb(90, 160, 230); --pos-verb: rgb(235, 140, 70);
        --pos-adj: rgb(175, 120, 220); --pos-adv: rgb(80, 190, 145);
        --pos-none: rgb(180, 180, 180);
      }
    }
    :root[data-theme="dark"] {
      --bg: #111111; --bg-alt: #1a1917; --text: #e8e4de; --text-mid: #b0aaa0;
      --text-light: #8a847a; --border: #2a2825;
      --pos-noun: rgb(90, 160, 230); --pos-verb: rgb(235, 140, 70);
      --pos-adj: rgb(175, 120, 220); --pos-adv: rgb(80, 190, 145);
      --pos-none: rgb(180, 180, 180);
    }
    :root[data-theme="light"] {
      --bg: #ffffff; --bg-alt: #f7f7f5; --text: #1a1a1a; --text-mid: #4a4a4a;
      --text-light: #717171; --border: #e0ddd8;
      --pos-noun: rgb(37, 99, 170); --pos-verb: rgb(196, 90, 17);
      --pos-adj: rgb(124, 58, 173); --pos-adv: rgb(31, 122, 90);
      --pos-none: rgb(30, 30, 30);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      -webkit-font-smoothing: antialiased;

    .container { max-width: 780px; margin: 0 auto; padding: 0 24px; }

    .back-link:hover { color: var(--text); }
    .main { padding: 60px 0 80px; }
    .page-label {

    .page-title {
      font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px;
    }
    .page-desc { font-size: 0.9rem; color: var(--text-mid); margin-bottom: 40px; }
    .input-area { margin-bottom: 32px; }
    .input-area textarea {
      width: 100%; padding: 16px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 1rem; font-family: inherit; line-height: 1.8; resize: vertical;

    .input-area textarea::placeholder { color: var(--text-light); }
    .btn-row { display: flex; gap: 8px; margin-top: 12px; }
    .btn-analyze {

    .diagram-area {

    }
    .chunk-text.has-pos { cursor: default; }
    .chunk-label {
      font-size: 0.7rem; font-weight: 700; margin-top: 4px;

    }
    .chunk-space { width: 6px; }

    .chunk-pos-명 .chunk-text { color: var(--pos-noun); border-bottom-color: var(--pos-noun); }
    .chunk-pos-명 .chunk-label { color: var(--pos-noun); }
    .chunk-pos-동 .chunk-text { color: var(--pos-verb); border-bottom-color: var(--pos-verb); }
    .chunk-pos-동 .chunk-label { color: var(--pos-verb); }
    .chunk-pos-형 .chunk-text { color: var(--pos-adj); border-bottom-color: var(--pos-adj); }
    .chunk-pos-형 .chunk-label { color: var(--pos-adj); }
    .chunk-pos-부 .chunk-text { color: var(--pos-adv); border-bottom-color: var(--pos-adv); }
    .chunk-pos-부 .chunk-label { color: var(--pos-adv); }
    .chunk-pos-none .chunk-text { color: var(--pos-none); border-bottom-color: var(--pos-none); }

    .legend {
      display: flex; flex-wrap: wrap; gap: 16px 28px; padding: 20px 24px;
      background: var(--bg-alt); border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 40px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    .examples { margin-top: 40px; }

    .example-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .example-chip {

    .example-chip:hover { border-color: var(--text); color: var(--text); }

    .guide { margin-top: 40px; }
    .guide-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 12px; color: var(--text-mid); }
    .guide-table {
      width: 100%; border-collapse: collapse; font-size: 0.82rem;
      overflow-x: auto; display: block;
    }
    .guide-table th, .guide-table td {
      padding: 8px 14px; text-align: left; border-bottom: 1px solid var(--border);
    }

      font-weight: 600; color: var(--text-light); font-size: 0.72rem;

    }
    .guide-table td { color: var(--text-mid); }

    @media (max-width: 768px) {
      .diagram-area { padding: 20px; }
      .chunk-text { font-size: 0.95rem; }
      .chunk-label { font-size: 0.65rem; }

<body>

  <div class="container">

      <a href="index.html">박태수<span class="logo-t">T</span></a>

  <div class="container main">
    <p class="page-label">THE FOUNDATION · 직독직해 다이어그램</p>
    <h1 class="page-title">직독직해 다이어그램</h1>
    <p class="page-desc">문장을 의미 단위(chunk)로 나누고, 품사 색상과 문장성분 라벨(S/V/O/C/M)로 구조를 시각화합니다.</p>

    <div class="input-area">
      <textarea id="sentenceInput" placeholder="영어 문장을 입력하세요.&#10;예: Many successful entrepreneurs attribute their achievements not to natural talent but to years of disciplined practice."></textarea>

    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:var(--pos-noun)"></span><span class="legend-label">명사</span><span class="legend-role">S / O / C</span></div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--pos-verb)"></span><span class="legend-label">동사</span><span class="legend-role">V</span></div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--pos-adj)"></span><span class="legend-label">형용사</span><span class="legend-role">M</span></div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--pos-adv)"></span><span class="legend-label">부사</span><span class="legend-role">M</span></div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--pos-none)"></span><span class="legend-label">접속사</span><span class="legend-role">무색</span></div>
    </div>

    <div class="examples">
      <p class="examples-title">예문으로 바로 분석해보기</p>
      <div class="example-chips">
        <button class="example-chip">Many successful entrepreneurs attribute their achievements not to natural talent but to years of disciplined practice.</button>
        <button class="example-chip">The student who studies hard every day will achieve remarkable results on the exam.</button>
        <button class="example-chip">Although the weather was extremely cold, she decided to walk to school because she wanted some fresh air.</button>
        <button class="example-chip">Reading books every day significantly improves your vocabulary and critical thinking skills.</button>
      </div>

    <div class="guide">
      <p class="guide-title">문장성분 라벨 안내</p>
      <table class="guide-table">
        <thead><tr><th>라벨</th><th>문장성분</th><th>설명</th></tr></thead>
        <tbody>
          <tr><td><strong>S</strong></td><td>주어</td><td>문장의 주체 (명사구)</td></tr>
          <tr><td><strong>V</strong></td><td>동사</td><td>서술어 (동사구)</td></tr>
          <tr><td><strong>O</strong></td><td>목적어</td><td>동사의 대상 (명사구)</td></tr>
          <tr><td><strong>C</strong></td><td>보어</td><td>주어/목적어를 보충 설명</td></tr>
          <tr><td><strong>M</strong></td><td>수식어</td><td>부사구, 형용사구, 전치사구 등</td></tr>
        </tbody>

  <script>
    var input = document.getElementById('sentenceInput');
    var diagramArea = document.getElementById('diagramArea');
    var analyzeBtn = document.getElementById('analyzeBtn');
    var clearBtn = document.getElementById('clearBtn');

    var coordConjunctions = ['and','but','or','nor','yet','so','for'];
    var prepositions = ['in','on','at','to','for','with','by','from','of','about','into','through','during','before','after','above','below','between','under','over','against','along','among','around','behind','beneath','beside','beyond','down','inside','near','off','onto','out','outside','past','since','toward','towards','until','upon','within','without','across','throughout','up','except','despite'];
    var subConjunctions = ['because','although','though','while','whereas','if','unless','since','until','when','whenever','where','wherever','once','than','whether','as','so that','even though','even if','in order to'];
    var beVerbs = ['is','are','was','were','am','be','been','being'];
    var linkingVerbs = ['become','became','seem','seemed','appear','appeared','remain','remained','feel','felt','look','looked','sound','sounded','taste','tasted','smell','smelled','grow','grew','turn','turned','prove','proved','get','got','stay','stayed'];
    var toObjVerbs = ['want','wants','wanted','need','needs','needed','hope','hopes','hoped','decide','decides','decided','plan','plans','planned','agree','agrees','agreed','offer','offers','offered','promise','promises','promised','refuse','refuses','refused','learn','learns','learned','expect','expects','expected','try','tries','tried','fail','fails','failed','manage','manages','managed','afford','affords','afforded','tend','tends','tended','pretend','pretends','pretended','choose','chooses','chose','wish','wishes','wished','desire','desires','desired','like','likes','liked','love','loves','loved','hate','hates','hated','prefer','prefers','preferred','begin','begins','began','start','starts','started','continue','continues','continued','intend','intends','intended'];
    var nounClauseConj = ['what','whoever','whatever','whichever'];
    var advClauseConj = ['because','although','though','while','whereas','unless','since','until','when','whenever','where','wherever','once','as','even though','even if','so that','in order to','after','before'];

    function analyze() {
      var text = input.value.trim();
      if (!text) return;
      var doc = nlp(text);
      var json = doc.json();
      var words = [];
      for (var s = 0; s < json.length; s++) {
        var terms = json[s].terms;
        for (var i = 0; i < terms.length; i++) {
          var t = terms[i];
          words.push({
            text: t.text, pre: t.pre || '', post: t.post || '',
            tags: t.tags || [], lower: (t.text || '').toLowerCase()
          });
        }
      }
      var chunks = buildChunks(words);
      chunks = ensureVerb(chunks, words);
      renderDiagram(chunks);
    }

    function hasTag(w, tag) { return w.tags.indexOf(tag) !== -1; }

    function hasVerbTag(w) {
      var vt = ['Verb','PastTense','PresentTense','Modal','Auxiliary','Copula','FutureTense'];
      for (var i = 0; i < vt.length; i++) { if (hasTag(w, vt[i])) return true; }
      return false;
    }

    function isMainVerbAhead(words, fromIdx) {
      for (var k = fromIdx; k < Math.min(fromIdx + 8, words.length); k++) {
        var w = words[k];
        if ((hasTag(w,'Verb') || hasTag(w,'PastTense') || hasTag(w,'PresentTense') || hasTag(w,'Modal'))
            && !hasTag(w,'Gerund') && !hasTag(w,'Participle')) return true;
      }
      return false;
    }

    function getPOS(word, ctx) {
      var lower = word.lower;
      if (coordConjunctions.indexOf(lower) !== -1 && lower !== 'for') return null;
      if (lower === 'for' && !hasTag(word, 'Verb')) return '부';
      if (lower === 'not' || lower === "n't") return '부';
      if (lower === 'there') return '부';
      if (['who','whom','whose','which'].indexOf(lower) !== -1) return null;
      if (lower === 'to') return null;
      if (prepositions.indexOf(lower) !== -1 && lower !== 'of') return '부';
      if (lower === 'of') return '부';
      if (hasTag(word, 'Pronoun')) return '명';
      if (hasTag(word, 'Determiner')) return '명';

      if (hasTag(word, 'Gerund')) {
        if (ctx && !ctx.foundSubject) return '명';
        if (ctx && ctx.foundVerb && !ctx.prevIsAux) return '명';
        return '동';
      }

      var verbTags = ['Verb','PastTense','PresentTense','Modal','Auxiliary','Copula','FutureTense'];
      for (var i = 0; i < verbTags.length; i++) {
        if (hasTag(word, verbTags[i])) return '동';
      }
      var nounTags = ['Noun','Singular','Plural','Uncountable','ProperNoun'];
      for (var i = 0; i < nounTags.length; i++) {
        if (hasTag(word, nounTags[i])) return '명';
      }
      var adjTags = ['Adjective','Comparable','Superlative'];
      for (var i = 0; i < adjTags.length; i++) {
        if (hasTag(word, adjTags[i])) return '형';
      }
      if (hasTag(word, 'Adverb')) return '부';
      if (hasTag(word, 'Negative')) return '부';
      var dets = ['the','a','an','this','that','these','those','my','your','his','her','its','our','their','each','every','some','any','no','all','both','few','several','many','much','most'];
      if (dets.indexOf(lower) !== -1) return '명';
      return null;
    }

    function collectClause(words, startIdx, isNoun) {
      var clauseWords = [words[startIdx]];
      var j = startIdx + 1;
      var depth = 0;
      var innerVerbCount = 0;
      while (j < words.length) {
        if (words[j].post.indexOf(',') !== -1 && depth === 0) {
          clauseWords.push(words[j]); j++; break;
        }
        if (subConjunctions.indexOf(words[j].lower) !== -1 || advClauseConj.indexOf(words[j].lower) !== -1) depth++;

        if (isNoun && depth === 0 && innerVerbCount > 0) {
          if (hasVerbTag(words[j]) && !hasTag(words[j], 'Gerund') && !hasTag(words[j], 'Auxiliary')) {
            break;
          }
        }
        if (hasVerbTag(words[j]) && !hasTag(words[j], 'Auxiliary') && !hasTag(words[j], 'Gerund') && depth === 0) {
          innerVerbCount++;
        }
        clauseWords.push(words[j]);
        j++;
      }
      return { words: clauseWords, nextIdx: j };
    }

    function collectPrepPhrase(words, startIdx) {
      var pWords = [words[startIdx]];
      var j = startIdx + 1;
      while (j < words.length) {
        var p = getPOS(words[j], {});
        if (p === '명' || p === '형' || words[j].lower === 'of') {
          pWords.push(words[j]);
          j++;
        } else {
          break;
        }
      }
      return { words: pWords, nextIdx: j };
    }

    function ensureVerb(chunks, words) {
      var has = false;
      for (var i = 0; i < chunks.length; i++) {
        if (chunks[i].role === 'V') { has = true; break; }
      }
      if (has) return chunks;

      for (var i = 0; i < chunks.length; i++) {
        if (chunks[i].pos === '동') { chunks[i].role = 'V'; return chunks; }
      }

      var verbWord = null;
      for (var i = 0; i < words.length; i++) {
        if (hasVerbTag(words[i]) && !hasTag(words[i], 'Gerund')) { verbWord = words[i].lower; break; }
      }
      if (!verbWord) {
        for (var i = 0; i < words.length; i++) {
          if (hasVerbTag(words[i])) { verbWord = words[i].lower; break; }
        }
      }
      if (!verbWord) return chunks;

      for (var i = 0; i < chunks.length; i++) {
        var ct = chunks[i].text.toLowerCase();
        var re = new RegExp('\\b' + verbWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b');
        if (re.test(ct) && chunks[i].pos !== '동') {
          var m = re.exec(ct);
          var before = chunks[i].text.substring(0, m.index).trim();
          var verb = chunks[i].text.substring(m.index, m.index + verbWord.length);
          var after = chunks[i].text.substring(m.index + verbWord.length).trim();
          var newChunks = chunks.slice(0, i);
          if (before) newChunks.push({ text: before, pos: chunks[i].pos, role: chunks[i].role });
          newChunks.push({ text: verb, pos: '동', role: 'V' });
          if (after) newChunks.push({ text: after, pos: '명', role: 'O' });
          for (var j = i + 1; j < chunks.length; j++) newChunks.push(chunks[j]);
          return newChunks;
        }
      }
      return chunks;
    }

    function buildChunks(words) {
      var chunks = [];
      var i = 0;
      var foundSubject = false;
      var foundVerb = false;
      var foundObject = false;
      var lastVerbText = '';
      var ctx = { foundSubject: false, foundVerb: false, prevIsAux: false };

      function lc() { return chunks.length > 0 ? chunks[chunks.length - 1] : null; }
      function wt(arr) { return arr.map(function(x) { return x.pre + x.text + x.post; }).join('').trim(); }

      while (i < words.length) {
        var w = words[i];
        var lower = w.lower;
        ctx.foundSubject = foundSubject;
        ctx.foundVerb = foundVerb;
        ctx.prevIsAux = i > 0 && (hasTag(words[i-1], 'Auxiliary') || hasTag(words[i-1], 'Copula') || beVerbs.indexOf(words[i-1].lower) !== -1);

        // 1) 등위접속사
        if (coordConjunctions.indexOf(lower) !== -1 && lower !== 'for') {
          chunks.push({ text: w.pre + w.text + w.post, pos: null, role: null });
          i++; continue;
        }

        // 2) 부사절/명사절 접속사
        if (advClauseConj.indexOf(lower) !== -1 || nounClauseConj.indexOf(lower) !== -1 || subConjunctions.indexOf(lower) !== -1) {
          var isNoun = nounClauseConj.indexOf(lower) !== -1;
          var cl = collectClause(words, i, isNoun);
          i = cl.nextIdx;
          if (isNoun) {
            var r = !foundSubject ? 'S' : 'O';
            if (!foundSubject) foundSubject = true;
            chunks.push({ text: wt(cl.words), pos: '명', role: r });
          } else {
            chunks.push({ text: wt(cl.words), pos: '부', role: null });
          }
          continue;
        }

        // 3) that 명사절 (동사 뒤)
        if (lower === 'that' && foundVerb) {
          var cl2 = collectClause(words, i, false);
          i = cl2.nextIdx;
          chunks.push({ text: wt(cl2.words), pos: '명', role: 'O' });
          continue;
        }

        // 4) 관계대명사절
        if (['who','whom','whose','which'].indexOf(lower) !== -1 && i > 0) {
          var relWords = [w]; i++;
          while (i < words.length) {
            if (coordConjunctions.indexOf(words[i].lower) !== -1 && words[i].lower !== 'for') break;
            if (words[i].post.indexOf(',') !== -1) { relWords.push(words[i]); i++; break; }
            relWords.push(words[i]); i++;
            var hv = false;
            for (var r2 = 0; r2 < relWords.length; r2++) {
              if (hasTag(relWords[r2], 'Verb') || hasTag(relWords[r2], 'PastTense') || hasTag(relWords[r2], 'PresentTense')) hv = true;
            }
            if (hv && i < words.length) {
              var nx = getPOS(words[i], ctx);
              if (nx === '동' || words[i].post.indexOf('.') !== -1 || (coordConjunctions.indexOf(words[i].lower) !== -1)) break;
              if (hasVerbTag(words[i]) && !hasTag(words[i], 'Auxiliary') && !hasTag(words[i], 'Gerund')) break;
            }
          }
          chunks.push({ text: wt(relWords), pos: '형', role: null });
          continue;
        }

        // 5) to 부정사 / to 전치사구
        if (lower === 'to') {
          if (i + 1 < words.length && (hasTag(words[i+1], 'Verb') || hasTag(words[i+1], 'Infinitive'))) {
            var tvw = [w, words[i+1]]; i += 2;
            while (i < words.length) {
              var tp = getPOS(words[i], ctx);
              if (tp === '명' || tp === '형') { tvw.push(words[i]); i++; }
              else break;
            }
            var tvt = wt(tvw);
            if (!foundSubject) {
              chunks.push({ text: tvt, pos: '명', role: 'S' }); foundSubject = true;
            } else if (foundObject && lc() && lc().role === 'O') {
              chunks.push({ text: tvt, pos: '동', role: null });
            } else if (foundVerb && toObjVerbs.indexOf(lastVerbText) !== -1) {
              chunks.push({ text: tvt, pos: '명', role: 'O' }); foundObject = true;
            } else if (foundVerb && lc() && lc().pos === '명' && lc().role === 'O') {
              chunks.push({ text: tvt, pos: '동', role: null });
            } else {
              chunks.push({ text: tvt, pos: '부', role: null });
            }
            continue;
          } else {
            var pp = collectPrepPhrase(words, i); i = pp.nextIdx;
            var ppt = wt(pp.words);
            var prev = lc();
            chunks.push({ text: ppt, pos: (prev && prev.pos === '명') ? '형' : '부', role: null });
            continue;
          }
        }

        // 6) 분사구문 (문장 시작 + 콤마)
        if (i === 0 && (hasTag(w, 'Gerund') || hasTag(w, 'Participle'))) {
          var commaAt = -1;
          for (var pc = i; pc < Math.min(i + 15, words.length); pc++) {
            if (words[pc].post.indexOf(',') !== -1) { commaAt = pc; break; }
          }
          if (commaAt !== -1) {
            var pw = []; var j = i;
            while (j <= commaAt) { pw.push(words[j]); j++; }
            i = j;
            chunks.push({ text: wt(pw), pos: '부', role: null });
            continue;
          }
        }

        // 7) 분사/동명사 — 주어 뒤, 동사 전: 뒤에 본동사가 있으면 형(수식어)
        if (foundSubject && !foundVerb && (hasTag(w, 'Gerund') || hasTag(w, 'Participle')) && isMainVerbAhead(words, i + 1)) {
          var modW = [w]; i++;
          while (i < words.length) {
            if (hasVerbTag(words[i]) && !hasTag(words[i], 'Gerund') && !hasTag(words[i], 'Participle') && !hasTag(words[i], 'Auxiliary')) break;
            var mp = getPOS(words[i], ctx);
            if (mp === '명' || mp === '형' || mp === '부' || prepositions.indexOf(words[i].lower) !== -1) {
              modW.push(words[i]); i++;
            } else break;
          }
          chunks.push({ text: wt(modW), pos: '형', role: null });
          continue;
        }

        var pos = getPOS(w, ctx);

        // 8) 명사구/형용사구
        if (pos === '명' || pos === '형') {
          var nw = [w]; i++;
          while (i < words.length) {
            if (foundSubject && !foundVerb && hasVerbTag(words[i]) && !hasTag(words[i], 'Gerund') && !hasTag(words[i], 'Participle')) break;
            if (hasTag(words[i], 'Gerund') && nw.length > 0 && isMainVerbAhead(words, i + 1)) {
              var alreadyHasNoun = false;
              for (var nn = 0; nn < nw.length; nn++) {
                if (hasTag(nw[nn], 'Noun') || hasTag(nw[nn], 'Singular') || hasTag(nw[nn], 'Plural') || hasTag(nw[nn], 'Pronoun')) { alreadyHasNoun = true; break; }
              }
              if (alreadyHasNoun) break;
            }
            var np2 = getPOS(words[i], ctx);
            if (np2 === '명' || np2 === '형' || words[i].lower === 'of') {
              nw.push(words[i]); i++;
            } else break;
          }
          var nt = wt(nw);
          var hasNoun = false;
          for (var ni = 0; ni < nw.length; ni++) {
            if (hasTag(nw[ni], 'Noun') || hasTag(nw[ni], 'Singular') || hasTag(nw[ni], 'Plural') || hasTag(nw[ni], 'Pronoun') || hasTag(nw[ni], 'Uncountable') || hasTag(nw[ni], 'ProperNoun') || hasTag(nw[ni], 'Determiner') || hasTag(nw[ni], 'Gerund')) { hasNoun = true; break; }
          }
          var cPos = hasNoun ? '명' : '형';
          var role = null;
          if (!foundSubject) { role = 'S'; foundSubject = true; }
          else if (foundVerb) {
            var pc2 = lc();
            if (pc2 && pc2.pos === '동') {
              var verbChunkWords = pc2.text.toLowerCase().split(/\s+/);
              var isBe = false;
              for (var bv = 0; bv < verbChunkWords.length; bv++) {
                if (beVerbs.indexOf(verbChunkWords[bv]) !== -1) { isBe = true; break; }
                if (linkingVerbs.indexOf(verbChunkWords[bv]) !== -1) { isBe = true; break; }
              }
              role = isBe ? 'C' : 'O';
            } else { role = 'O'; }
            foundObject = true;
          }
          chunks.push({ text: nt, pos: cPos, role: role });
          continue;
        }

        // 9) 동사구
        if (pos === '동') {
          var vw = [w]; i++;
          while (i < words.length) {
            var vp = getPOS(words[i], ctx);
            if (vp === '동' || hasTag(words[i], 'Auxiliary') || hasTag(words[i], 'Modal') || words[i].lower === 'not' || words[i].lower === "n't") {
              vw.push(words[i]); i++;
            } else break;
          }
          foundVerb = true;
          lastVerbText = vw[vw.length - 1].lower;
          chunks.push({ text: wt(vw), pos: '동', role: 'V' });
          continue;
        }

        // 10) 전치사구 / 부사
        if (pos === '부' || prepositions.indexOf(lower) !== -1) {
          if (prepositions.indexOf(lower) !== -1) {
            var pp2 = collectPrepPhrase(words, i); i = pp2.nextIdx;
            var ppt2 = wt(pp2.words);
            var prev2 = lc();
            chunks.push({ text: ppt2, pos: (prev2 && prev2.pos === '명') ? '형' : '부', role: null });
          } else {
            chunks.push({ text: w.pre + w.text + w.post, pos: '부', role: null });
            i++;
          }
          continue;
        }

        // 11) 미분류
        if (pos === null) {
          if (chunks.length > 0 && chunks[chunks.length - 1].pos) {
            chunks[chunks.length - 1].text += w.pre + w.text + w.post;
          } else {
            chunks.push({ text: w.pre + w.text + w.post, pos: '부', role: null });
          }
          i++; continue;
        }

        chunks.push({ text: w.pre + w.text + w.post, pos: pos || '부', role: null });
        i++;
      }
      return chunks;
    }

    function renderDiagram(chunks) {
      diagramArea.innerHTML = '';
      var line = document.createElement('div');
      line.className = 'diagram-line';

      for (var i = 0; i < chunks.length; i++) {
        var c = chunks[i];
        if (!c.text.trim()) continue;

        var chunkEl = document.createElement('div');
        var posClass = c.pos ? 'chunk-pos-' + c.pos : 'chunk-pos-none';
        chunkEl.className = 'chunk ' + posClass;

        var textEl = document.createElement('span');
        textEl.className = 'chunk-text' + (c.pos ? ' has-pos' : '');
        textEl.textContent = c.text;
        chunkEl.appendChild(textEl);

        var labelText = '';
        if (c.pos && c.role) labelText = c.pos + '(' + c.role + ')';
        else if (c.role) labelText = c.role;
        else if (c.pos) labelText = c.pos;

        if (labelText) {
          var labelEl = document.createElement('span');
          labelEl.className = 'chunk-label';
          labelEl.textContent = labelText;
          chunkEl.appendChild(labelEl);
        }

        line.appendChild(chunkEl);
      }

      diagramArea.appendChild(line);
    }

    analyzeBtn.addEventListener('click', analyze);
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); analyze(); }
    });
    clearBtn.addEventListener('click', function() {
      input.value = '';
      diagramArea.innerHTML = '';
      input.focus();
    });
    document.querySelectorAll('.example-chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        input.value = chip.textContent;
        analyze();
      });
    });
  </script>
</body>
</html>
