<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생 관리 · 박태수T</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #1a1a1a;
      --accent: #c0392b;
      --accent-light: #e74c3c;
      --blue: #2980b9;
      --green: #27ae60;
      --orange: #e67e22;
      --text: #1a1a1a;
      --text-mid: #4a4a4a;
      --text-light: #717171;
      --bg: #ffffff;
      --bg-alt: #f7f7f5;
      --bg-card: #ffffff;
      --border: #e0ddd8;
      --border-light: #ebe8e3;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
      --radius: 8px;
      --transition: 0.25s ease;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #f0ece6;
        --accent: #e74c3c;
        --accent-light: #ff6b5a;
        --blue: #5dade2;
        --green: #2ecc71;
        --orange: #f39c12;
        --text: #e8e4de;
        --text-mid: #b0aaa0;
        --text-light: #8a847a;
        --bg: #111111;
        --bg-alt: #1a1917;
        --bg-card: #1e1d1b;
        --border: #2a2825;
        --border-light: #222120;
        --shadow: 0 1px 3px rgba(0,0,0,0.3);
        --shadow-lg: 0 8px 32px rgba(0,0,0,0.3);
      }
    }
    :root[data-theme="dark"] {
      --primary: #f0ece6;
      --accent: #e74c3c;
      --accent-light: #ff6b5a;
      --blue: #5dade2;
      --green: #2ecc71;
      --orange: #f39c12;
      --text: #e8e4de;
      --text-mid: #b0aaa0;
      --text-light: #8a847a;
      --bg: #111111;
      --bg-alt: #1a1917;
      --bg-card: #1e1d1b;
      --border: #2a2825;
      --border-light: #222120;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.3);
    }
    :root[data-theme="light"] {
      --primary: #1a1a1a;
      --accent: #c0392b;
      --accent-light: #e74c3c;
      --blue: #2980b9;
      --green: #27ae60;
      --orange: #e67e22;
      --text: #1a1a1a;
      --text-mid: #4a4a4a;
      --text-light: #717171;
      --bg: #ffffff;
      --bg-alt: #f7f7f5;
      --bg-card: #ffffff;
      --border: #e0ddd8;
      --border-light: #ebe8e3;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      background: var(--bg-alt);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .top-bar {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .top-bar .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .top-bar .logo span { color: var(--accent); }

    .top-bar .badge {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 4px;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
    }

    .back-link {
      font-size: 0.85rem;
      color: var(--text-light);
      text-decoration: none;
      transition: var(--transition);
    }

    .back-link:hover { color: var(--text); }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      width: fit-content;
      margin-bottom: 24px;
    }

    .tab-btn {
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      background: transparent;
      color: var(--text-light);
      font-family: inherit;
    }

    .tab-btn.active {
      background: var(--text);
      color: var(--bg);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 140px;
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-light);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input, select {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.88rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      transition: var(--transition);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--blue);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
    }

    .btn-primary:hover { opacity: 0.85; }

    .btn-accent {
      background: var(--accent);
      color: #fff;
    }

    .btn-accent:hover { opacity: 0.85; }

    .btn-outline {
      border: 1px solid var(--border);
      color: var(--text);
      background: transparent;
    }

    .btn-outline:hover { border-color: var(--text); }

    .btn-sm {
      padding: 5px 12px;
      font-size: 0.78rem;
    }

    .btn-danger {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .btn-danger:hover {
      background: var(--accent);
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th {
      text-align: left;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-light);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 8px 12px;
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    .table-wrap { overflow-x: auto; }

    .phone-link {
      color: var(--blue);
      text-decoration: none;
      font-variant-numeric: tabular-nums;
    }

    .phone-link:hover { text-decoration: underline; }

    .class-tag {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      background: var(--border-light);
      color: var(--text-mid);
    }

    .check-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: transparent;
    }

    .check-btn.checked {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .check-btn:hover { border-color: var(--green); }

    .stat-row {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .stat-num {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-light);
      font-weight: 500;
      margin-top: 2px;
    }

    .date-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .date-nav button {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      color: var(--text);
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .date-nav button:hover { border-color: var(--text); }

    .date-display {
      font-size: 0.9rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      min-width: 120px;
      text-align: center;
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-light);
      font-size: 0.9rem;
    }

    .hw-status {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .hw-status.done { background: #e8f5e9; color: #2e7d32; }
    .hw-status.pending { background: #fff3e0; color: #e65100; }

    @media (prefers-color-scheme: dark) {
      .hw-status.done { background: #1a3d1a; color: #66bb6a; }
      .hw-status.pending { background: #3d2a0a; color: #ffb74d; }
    }
    :root[data-theme="dark"] .hw-status.done { background: #1a3d1a; color: #66bb6a; }
    :root[data-theme="dark"] .hw-status.pending { background: #3d2a0a; color: #ffb74d; }
    :root[data-theme="light"] .hw-status.done { background: #e8f5e9; color: #2e7d32; }
    :root[data-theme="light"] .hw-status.pending { background: #fff3e0; color: #e65100; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      width: 90%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
    }

    .modal h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .actions-cell {
      display: flex;
      gap: 6px;
    }

    @media (max-width: 768px) {
      .stat-row { flex-direction: column; }
      .form-row { flex-direction: column; }
      .tabs { width: 100%; }
      .tab-btn { flex: 1; text-align: center; padding: 10px 12px; }
      .container { padding: 16px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-left">
      <a href="index.html" class="logo">박태수<span>T</span></a>
      <span class="badge">관리</span>
    </div>
    <a href="index.html" class="back-link">&larr; 메인으로</a>
  </div>

  <div class="container">
    <div class="stat-row" id="stats"></div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="students">학생 관리</button>
      <button class="tab-btn" data-tab="attendance">등원 체크</button>
      <button class="tab-btn" data-tab="homework">과제 관리</button>
    </div>

    <!-- 학생 관리 -->
    <div class="tab-panel active" id="panel-students">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">학생 등록</h2>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>이름</label>
            <input type="text" id="stuName" placeholder="학생 이름">
          </div>
          <div class="form-group">
            <label>반</label>
            <select id="stuClass">
              <option value="FOUNDATION">THE FOUNDATION</option>
              <option value="AXIS독해">AXIS : 독해의 축</option>
              <option value="AXIS실전">AXIS : 실전모의고사</option>
              <option value="KILLER">AXIS : KILLER</option>
              <option value="방산고">방산고</option>
              <option value="배명고">배명고</option>
              <option value="가락고">가락고</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>학생 전화번호</label>
            <input type="tel" id="stuPhone" placeholder="010-0000-0000">
          </div>
          <div class="form-group">
            <label>학부모 전화번호</label>
            <input type="tel" id="parentPhone" placeholder="010-0000-0000">
          </div>
        </div>
        <button class="btn btn-primary" onclick="addStudent()">학생 등록</button>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">학생 목록</h2>
          <div style="display:flex;gap:8px;align-items:center;">
            <select id="filterClass" onchange="renderStudents()" style="font-size:0.82rem;">
              <option value="">전체 반</option>
              <option value="FOUNDATION">THE FOUNDATION</option>
              <option value="AXIS독해">AXIS : 독해의 축</option>
              <option value="AXIS실전">AXIS : 실전모의고사</option>
              <option value="KILLER">AXIS : KILLER</option>
              <option value="방산고">방산고</option>
              <option value="배명고">배명고</option>
              <option value="가락고">가락고</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>이름</th>
                <th>반</th>
                <th>학생 연락처</th>
                <th>학부모 연락처</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="studentTable"></tbody>
          </table>
          <div class="empty-state" id="emptyStudents">등록된 학생이 없습니다.</div>
        </div>
      </div>
    </div>

    <!-- 등원 체크 -->
    <div class="tab-panel" id="panel-attendance">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">등원 체크</h2>
          <div class="date-nav">
            <button onclick="changeDate(-1)">&larr;</button>
            <span class="date-display" id="attendDate"></span>
            <button onclick="changeDate(1)">&rarr;</button>
          </div>
        </div>
        <div style="margin-bottom:16px;">
          <select id="attendClassFilter" onchange="renderAttendance()" style="font-size:0.82rem;">
            <option value="">전체 반</option>
            <option value="FOUNDATION">THE FOUNDATION</option>
            <option value="AXIS독해">AXIS : 독해의 축</option>
            <option value="AXIS실전">AXIS : 실전모의고사</option>
            <option value="KILLER">AXIS : KILLER</option>
            <option value="방산고">방산고</option>
            <option value="배명고">배명고</option>
            <option value="가락고">가락고</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>이름</th>
                <th>반</th>
                <th style="text-align:center;">등원</th>
              </tr>
            </thead>
            <tbody id="attendTable"></tbody>
          </table>
          <div class="empty-state" id="emptyAttend" style="display:none;">등록된 학생이 없습니다.</div>
        </div>
      </div>
    </div>

    <!-- 과제 관리 -->
    <div class="tab-panel" id="panel-homework">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">과제 등록</h2>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>과제명</label>
            <input type="text" id="hwTitle" placeholder="과제 내용">
          </div>
          <div class="form-group">
            <label>대상 반</label>
            <select id="hwClass">
              <option value="FOUNDATION">THE FOUNDATION</option>
              <option value="AXIS독해">AXIS : 독해의 축</option>
              <option value="AXIS실전">AXIS : 실전모의고사</option>
              <option value="KILLER">AXIS : KILLER</option>
              <option value="방산고">방산고</option>
              <option value="배명고">배명고</option>
              <option value="가락고">가락고</option>
            </select>
          </div>
          <div class="form-group">
            <label>마감일</label>
            <input type="date" id="hwDue">
          </div>
        </div>
        <button class="btn btn-primary" onclick="addHomework()">과제 등록</button>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">과제 현황</h2>
          <select id="hwClassFilter" onchange="renderHomework()" style="font-size:0.82rem;">
            <option value="">전체 반</option>
            <option value="FOUNDATION">THE FOUNDATION</option>
            <option value="AXIS독해">AXIS : 독해의 축</option>
            <option value="AXIS실전">AXIS : 실전모의고사</option>
            <option value="KILLER">AXIS : KILLER</option>
            <option value="방산고">방산고</option>
            <option value="배명고">배명고</option>
            <option value="가락고">가락고</option>
          </select>
        </div>
        <div id="hwList"></div>
        <div class="empty-state" id="emptyHw">등록된 과제가 없습니다.</div>
      </div>
    </div>
  </div>

  <!-- 학생 수정 모달 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>학생 정보 수정</h3>
      <input type="hidden" id="editId">
      <div class="form-row">
        <div class="form-group">
          <label>이름</label>
          <input type="text" id="editName">
        </div>
        <div class="form-group">
          <label>반</label>
          <select id="editClass">
            <option value="FOUNDATION">THE FOUNDATION</option>
            <option value="AXIS독해">AXIS : 독해의 축</option>
            <option value="AXIS실전">AXIS : 실전모의고사</option>
            <option value="KILLER">AXIS : KILLER</option>
            <option value="방산고">방산고</option>
            <option value="배명고">배명고</option>
            <option value="가락고">가락고</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>학생 전화번호</label>
          <input type="tel" id="editPhone">
        </div>
        <div class="form-group">
          <label>학부모 전화번호</label>
          <input type="tel" id="editParent">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">취소</button>
        <button class="btn btn-primary" onclick="saveEdit()">저장</button>
      </div>
    </div>
  </div>

<script>
var STORE_STUDENTS = 'ptsStudents';
var STORE_ATTEND = 'ptsAttendance';
var STORE_HW = 'ptsHomework';
var STORE_HW_STATUS = 'ptsHwStatus';

var currentDate = new Date();

function load(key) {
  try { return JSON.parse(localStorage.getItem(key)) || []; }
  catch(e) { return []; }
}

function save(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function formatPhone(p) {
  if (!p) return '-';
  var d = p.replace(/\D/g, '');
  if (d.length === 11) return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7);
  if (d.length === 10) return d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6);
  return p;
}

function dateStr(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}

function dateDisplay(d) {
  var days = ['일','월','화','수','목','금','토'];
  return (d.getMonth()+1) + '/' + d.getDate() + ' (' + days[d.getDay()] + ')';
}

// --- 탭 ---
document.querySelectorAll('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// --- 통계 ---
function renderStats() {
  var students = load(STORE_STUDENTS);
  var today = dateStr(new Date());
  var attend = load(STORE_ATTEND);
  var todayAttend = attend.filter(function(a) { return a.date === today; });
  var hw = load(STORE_HW);
  var hwStatus = load(STORE_HW_STATUS);
  var activeHw = hw.filter(function(h) { return h.due >= today; });
  var totalTasks = 0;
  var doneTasks = 0;
  activeHw.forEach(function(h) {
    var classStudents = students.filter(function(s) { return s.cls === h.cls; });
    totalTasks += classStudents.length;
    classStudents.forEach(function(s) {
      var key = h.id + '_' + s.id;
      var st = hwStatus.find(function(x) { return x.key === key; });
      if (st && st.done) doneTasks++;
    });
  });

  document.getElementById('stats').innerHTML =
    '<div class="stat-card"><div class="stat-num">' + students.length + '</div><div class="stat-label">등록 학생</div></div>' +
    '<div class="stat-card"><div class="stat-num">' + todayAttend.length + ' / ' + students.length + '</div><div class="stat-label">오늘 등원</div></div>' +
    '<div class="stat-card"><div class="stat-num">' + doneTasks + ' / ' + totalTasks + '</div><div class="stat-label">과제 수행률 (진행 중)</div></div>';
}

// --- 학생 관리 ---
function addStudent() {
  var name = document.getElementById('stuName').value.trim();
  var cls = document.getElementById('stuClass').value;
  var phone = document.getElementById('stuPhone').value.trim();
  var parent = document.getElementById('parentPhone').value.trim();
  if (!name) { alert('학생 이름을 입력하세요.'); return; }

  var students = load(STORE_STUDENTS);
  students.push({ id: genId(), name: name, cls: cls, phone: phone, parent: parent });
  save(STORE_STUDENTS, students);

  document.getElementById('stuName').value = '';
  document.getElementById('stuPhone').value = '';
  document.getElementById('parentPhone').value = '';

  renderStudents();
  renderStats();
}

function renderStudents() {
  var students = load(STORE_STUDENTS);
  var filter = document.getElementById('filterClass').value;
  var filtered = filter ? students.filter(function(s) { return s.cls === filter; }) : students;

  var empty = document.getElementById('emptyStudents');
  var tbody = document.getElementById('studentTable');

  if (filtered.length === 0) {
    empty.style.display = 'block';
    tbody.innerHTML = '';
    return;
  }

  empty.style.display = 'none';
  tbody.innerHTML = filtered.map(function(s) {
    return '<tr>' +
      '<td><strong>' + esc(s.name) + '</strong></td>' +
      '<td><span class="class-tag">' + esc(s.cls) + '</span></td>' +
      '<td><a class="phone-link" href="tel:' + esc(s.phone) + '">' + formatPhone(s.phone) + '</a></td>' +
      '<td><a class="phone-link" href="tel:' + esc(s.parent) + '">' + formatPhone(s.parent) + '</a></td>' +
      '<td class="actions-cell">' +
        '<button class="btn btn-outline btn-sm" onclick="openEdit(\'' + s.id + '\')">수정</button>' +
        '<button class="btn btn-danger btn-sm" onclick="deleteStudent(\'' + s.id + '\')">삭제</button>' +
      '</td></tr>';
  }).join('');
}

function deleteStudent(id) {
  if (!confirm('이 학생을 삭제하시겠습니까?')) return;
  var students = load(STORE_STUDENTS);
  students = students.filter(function(s) { return s.id !== id; });
  save(STORE_STUDENTS, students);
  renderStudents();
  renderStats();
}

function openEdit(id) {
  var students = load(STORE_STUDENTS);
  var s = students.find(function(x) { return x.id === id; });
  if (!s) return;
  document.getElementById('editId').value = s.id;
  document.getElementById('editName').value = s.name;
  document.getElementById('editClass').value = s.cls;
  document.getElementById('editPhone').value = s.phone;
  document.getElementById('editParent').value = s.parent;
  document.getElementById('editModal').classList.add('active');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('active');
}

function saveEdit() {
  var id = document.getElementById('editId').value;
  var students = load(STORE_STUDENTS);
  var s = students.find(function(x) { return x.id === id; });
  if (!s) return;
  s.name = document.getElementById('editName').value.trim();
  s.cls = document.getElementById('editClass').value;
  s.phone = document.getElementById('editPhone').value.trim();
  s.parent = document.getElementById('editParent').value.trim();
  save(STORE_STUDENTS, students);
  closeModal();
  renderStudents();
  renderStats();
}

// --- 등원 체크 ---
function changeDate(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  renderAttendance();
}

function renderAttendance() {
  var ds = dateStr(currentDate);
  document.getElementById('attendDate').textContent = dateDisplay(currentDate);

  var students = load(STORE_STUDENTS);
  var filter = document.getElementById('attendClassFilter').value;
  var filtered = filter ? students.filter(function(s) { return s.cls === filter; }) : students;
  var attend = load(STORE_ATTEND);

  var empty = document.getElementById('emptyAttend');
  var tbody = document.getElementById('attendTable');

  if (filtered.length === 0) {
    empty.style.display = 'block';
    tbody.innerHTML = '';
    return;
  }

  empty.style.display = 'none';
  tbody.innerHTML = filtered.map(function(s) {
    var isChecked = attend.some(function(a) { return a.sid === s.id && a.date === ds; });
    return '<tr>' +
      '<td><strong>' + esc(s.name) + '</strong></td>' +
      '<td><span class="class-tag">' + esc(s.cls) + '</span></td>' +
      '<td style="text-align:center;">' +
        '<button class="check-btn' + (isChecked ? ' checked' : '') + '" onclick="toggleAttend(\'' + s.id + '\')">' +
          (isChecked ? '&#10003;' : '') +
        '</button>' +
      '</td></tr>';
  }).join('');
}

function toggleAttend(sid) {
  var ds = dateStr(currentDate);
  var attend = load(STORE_ATTEND);
  var idx = attend.findIndex(function(a) { return a.sid === sid && a.date === ds; });
  if (idx >= 0) {
    attend.splice(idx, 1);
  } else {
    attend.push({ sid: sid, date: ds });
  }
  save(STORE_ATTEND, attend);
  renderAttendance();
  renderStats();
}

// --- 과제 관리 ---
function addHomework() {
  var title = document.getElementById('hwTitle').value.trim();
  var cls = document.getElementById('hwClass').value;
  var due = document.getElementById('hwDue').value;
  if (!title) { alert('과제명을 입력하세요.'); return; }
  if (!due) { alert('마감일을 선택하세요.'); return; }

  var hw = load(STORE_HW);
  hw.push({ id: genId(), title: title, cls: cls, due: due, created: dateStr(new Date()) });
  save(STORE_HW, hw);

  document.getElementById('hwTitle').value = '';
  document.getElementById('hwDue').value = '';

  renderHomework();
  renderStats();
}

function renderHomework() {
  var hw = load(STORE_HW);
  var filter = document.getElementById('hwClassFilter').value;
  var filtered = filter ? hw.filter(function(h) { return h.cls === filter; }) : hw;
  filtered.sort(function(a, b) { return b.due < a.due ? -1 : 1; });

  var students = load(STORE_STUDENTS);
  var hwStatus = load(STORE_HW_STATUS);
  var container = document.getElementById('hwList');
  var empty = document.getElementById('emptyHw');

  if (filtered.length === 0) {
    empty.style.display = 'block';
    container.innerHTML = '';
    return;
  }

  empty.style.display = 'none';
  container.innerHTML = filtered.map(function(h) {
    var classStudents = students.filter(function(s) { return s.cls === h.cls; });
    var doneCount = 0;
    var rows = classStudents.map(function(s) {
      var key = h.id + '_' + s.id;
      var st = hwStatus.find(function(x) { return x.key === key; });
      var isDone = st && st.done;
      if (isDone) doneCount++;
      return '<tr>' +
        '<td>' + esc(s.name) + '</td>' +
        '<td style="text-align:center;">' +
          '<button class="check-btn' + (isDone ? ' checked' : '') + '" onclick="toggleHw(\'' + h.id + '\',\'' + s.id + '\')">' +
            (isDone ? '&#10003;' : '') +
          '</button>' +
        '</td>' +
        '<td><span class="hw-status ' + (isDone ? 'done' : 'pending') + '">' + (isDone ? '완료' : '미완료') + '</span></td>' +
        '</tr>';
    }).join('');

    var isPast = h.due < dateStr(new Date());

    return '<div class="card" style="margin-bottom:12px;">' +
      '<div class="card-header">' +
        '<div>' +
          '<span class="class-tag">' + esc(h.cls) + '</span> ' +
          '<strong style="margin-left:8px;">' + esc(h.title) + '</strong>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:12px;">' +
          '<span style="font-size:0.8rem;color:' + (isPast ? 'var(--accent)' : 'var(--text-light)') + ';">마감 ' + h.due + '</span>' +
          '<span style="font-size:0.8rem;color:var(--text-mid);">' + doneCount + '/' + classStudents.length + '</span>' +
          '<button class="btn btn-danger btn-sm" onclick="deleteHw(\'' + h.id + '\')">삭제</button>' +
        '</div>' +
      '</div>' +
      (classStudents.length > 0 ?
        '<div class="table-wrap"><table><thead><tr><th>학생</th><th style="text-align:center;">수행</th><th>상태</th></tr></thead><tbody>' + rows + '</tbody></table></div>' :
        '<div class="empty-state" style="padding:16px;">해당 반에 등록된 학생이 없습니다.</div>'
      ) +
      '</div>';
  }).join('');
}

function toggleHw(hwId, stuId) {
  var key = hwId + '_' + stuId;
  var hwStatus = load(STORE_HW_STATUS);
  var st = hwStatus.find(function(x) { return x.key === key; });
  if (st) {
    st.done = !st.done;
  } else {
    hwStatus.push({ key: key, done: true });
  }
  save(STORE_HW_STATUS, hwStatus);
  renderHomework();
  renderStats();
}

function deleteHw(id) {
  if (!confirm('이 과제를 삭제하시겠습니까?')) return;
  var hw = load(STORE_HW);
  hw = hw.filter(function(h) { return h.id !== id; });
  save(STORE_HW, hw);
  renderHomework();
  renderStats();
}

function esc(str) {
  var d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

// 초기 렌더링
renderStats();
renderStudents();
renderAttendance();
renderHomework();
</script>
